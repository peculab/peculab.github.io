title: PecuLab LLC
description: Applied AI education, automation, and cross-border execution.
url: "https://peculab.github.io"
baseurl: ""
timezone: America/Los_Angeles

collections:
  shorts:
    output: true
    permalink: /shorts/:name.html

plugins:
  - jekyll-sitemap

permalink: /field-notes/:year/:month/:day/:title.html

defaults:
  - scope:
      path: ""
      type: shorts
    values:
      layout: short
      lang: zh-Hant
      author: Yun-Cheng (Pecu) Tsai
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      category: field-notes
      author: Yun-Cheng (Pecu) Tsai

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - .facebook-import
  - docs
  - field-notes/local-preview
  - scripts
