name: Update interest COUNT file
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read submissions and update aggregate COUNT file
        env:
          FORMSUBMIT_API_KEY: ${{ secrets.FORMSUBMIT_API_KEY }}
        run: |
          if [ -z "$FORMSUBMIT_API_KEY" ]; then
            echo 'FORMSUBMIT_API_KEY secret is missing. COUNT file remains unchanged.'
            exit 0
          fi
          python scripts/update_interest_counts.py
      - name: Commit COUNT file only
        run: |
          if git diff --quiet -- interest-counts.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interest-counts.json
          git commit -m 'Update interest COUNT file'
          git push
